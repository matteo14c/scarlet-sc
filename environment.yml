name: scarlet-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy>=2.4.4
  - scipy>=1.17.1
  - pandas>=2.3.3
  - scikit-learn>=1.8.0
  - anndata>=0.12.14
  - scanpy>=1.11.5
  # Python 3.11: scanpy up to 1.11, which works with umap-learn below 0.6 and pynndescent below 0.7 (the report's UMAP)
  - umap-learn<0.6
  - pynndescent<0.7
  - tqdm
  - numba
  - pip
